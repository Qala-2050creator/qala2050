<!DOCTYPE html>
<html lang="kk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>QALA 2050 — Kyzylorda</title>
<meta name="description" content="QALA 2050 — AI Urban Digital Twin Platform for Kyzylorda, Kazakhstan. Қаланың болашағын салмай тұрып көр!">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap&subset=cyrillic-ext">
<link rel="stylesheet" href="css/app.css">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 48 48%22%3E%3Crect x=%223%22 y=%223%22 width=%2242%22 height=%2242%22 rx=%2211%22 fill=%22%230b1a30%22/%3E%3Crect x=%2220%22 y=%2213%22 width=%226%22 height=%2221%22 fill=%22%2322d3ee%22/%3E%3C/svg%3E">
</head>
<body>
<header id="top">
  <button id="burger" class="ib" data-i18n-title="menu">☰</button>
  <a class="brand" href="#" id="brand"><span id="logo"></span><span class="bt">QALA<b>2050</b></span><span class="tag" data-i18n="tagline"></span></a>
  <select id="citySel" data-i18n-title="citySel"></select>
  <div class="gsearch"><input id="gSearch" type="search" autocomplete="off" data-i18n-ph="searchPh" data-i18n-title="searchPh"><div id="gRes" hidden></div></div>
  <span id="yearChip" class="ychip"></span>
  <button id="dataStatus" class="ds"></button>
  <div id="langSw" class="seg" role="group"><button data-l="kk">ҚАЗ</button><button data-l="ru">РУС</button><button data-l="en">ENG</button></div>
  <button id="bell" class="ib" data-i18n-title="notifications">🔔<span id="noteCount" hidden>0</span></button>
  <div id="notes" hidden></div>
  <button id="gear" class="ib" data-i18n-title="nav_settings">⚙</button>
  <button id="kpiBtn" class="ib" data-i18n-title="metrics">▤</button>
  <button id="pitchBtn" class="btn pri"><span>▶</span> <span data-i18n="pitchMode"></span></button>
</header>
<nav id="nav" aria-label="Modules"></nav>
<main id="stage">
  <div id="mapWrap">
    <div id="map"></div><div id="map2" hidden></div>
    <span id="lblA" class="cmp-l a">A</span><span id="lblB" class="cmp-l b">B</span>
    <div id="mapBadge"></div>
    <div id="tools">
      <button class="ib" id="tZin" data-i18n-title="zoomIn">+</button><button class="ib" id="tZout" data-i18n-title="zoomOut">−</button>
      <button class="ib" id="tNorth" data-i18n-title="compass"><span id="compassN">➤</span></button>
      <button class="ib" id="t3d" data-i18n-title="t3d">3D</button><button class="ib" id="tOrbit" data-i18n-title="orbit">⟳</button>
      <button class="ib" id="tFull" data-i18n-title="fullscreen">⛶</button><button class="ib" id="tMeasure" data-i18n-title="measure">📏</button>
      <button class="ib" id="tReset" data-i18n-title="resetCam">⌂</button><button class="ib" id="tTheme" data-i18n-title="dayNight">☾</button>
      <button class="ib" id="tShot" data-i18n-title="screenshot">📷</button>
    </div>
    <div id="scaleBox"><div id="scale">—</div><span id="coords"></span></div>
    <div id="legend"></div>
    <div id="measureOut" hidden></div>
    <div id="mapBusy" hidden><i></i></div>
    <aside id="info" hidden></aside>
  </div>
  <aside id="panel" aria-live="polite"></aside>
</main>
<aside id="right"></aside>
<footer id="bottom"></footer>
<div id="loading"><div class="spin"></div><p id="loadingMsg">QALA 2050</p></div>
<div id="modal" hidden></div><div id="toasts" aria-live="polite"></div><div id="pitch" hidden></div><div id="deck" hidden></div>
<script src="js/i18n.js"></script><script src="js/icons.js"></script><script src="js/engine.js"></script><script src="js/data.js"></script>
<script src="js/map-lite.js"></script><script src="js/map-live.js"></script><script src="js/core.js"></script><script src="js/views.js"></script>
<script src="js/mayor.js"></script><script src="js/reports.js"></script><script src="js/pitch.js"></script><script src="js/main.js"></script>
</body>
</html>
